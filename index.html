<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jul Shot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- Hauptmenü -->
<div id="menu" class="overlay">
  <div class="panel">
    <h1 class="logo">JUL SHOT</h1>
    <p class="tagline">Ein Weltraum-Shooter</p>
    <button id="btnStart" class="btn primary">Spiel starten</button>
    <div class="controls">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Fliegen</div>
      <div><kbd>Maus</kbd> Zielen</div>
      <div><kbd>Linksklick</kbd> / <kbd>Leertaste</kbd> Schießen</div>
      <div><kbd>Q</kbd> / <kbd>Rechtsklick</kbd> Ultimate (alle 20 Sek.)</div>
      <div><kbd>F</kbd> Auto-Feuer an/aus</div>
      <div><kbd>P</kbd> / <kbd>Esc</kbd> Pause</div>
    </div>
    <h2>Scoreboard</h2>
    <table class="scores" id="menuScores"></table>
  </div>
</div>

<!-- Upgrade-Auswahl -->
<div id="upgrade" class="overlay hidden">
  <div class="panel wide">
    <h2 id="upTitle">Wähle ein Upgrade</h2>
    <p id="upSub" class="tagline"></p>
    <div id="cards" class="cards"></div>
    <p class="hint">Klicke eine Karte oder drücke <kbd>1</kbd>–<kbd>6</kbd></p>
  </div>
</div>

<!-- Pause -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2>Pause</h2>
    <button id="btnResume" class="btn primary">Weiter</button>
    <button id="btnQuit" class="btn">Zum Menü</button>
  </div>
</div>

<!-- Game Over -->
<div id="gameover" class="overlay hidden">
  <div class="panel">
    <h1 class="logo red">GAME OVER</h1>
    <p class="final">Punkte: <span id="finalScore">0</span></p>
    <p class="tagline" id="finalInfo"></p>
    <form id="nameForm" class="nameform">
      <input id="nameInput" maxlength="12" placeholder="Dein Name" autocomplete="off">
      <button type="submit" class="btn primary">Speichern</button>
    </form>
    <h2>Scoreboard</h2>
    <table class="scores" id="overScores"></table>
    <div class="row">
      <button id="btnRetry" class="btn primary">Nochmal</button>
      <button id="btnMenu" class="btn">Menü</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
